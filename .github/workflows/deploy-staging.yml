name: Deploy staging
run-name: Deploy staging from ${{ github.ref_name }}

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-config:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    permissions:
      contents: read
    outputs:
      supabase_url: ${{ steps.values.outputs.supabase_url }}
      supabase_anon_key: ${{ steps.values.outputs.supabase_anon_key }}
    steps:
      - name: Read staging frontend configuration
        id: values
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -Eeuo pipefail

          if [[ "$SUPABASE_URL" != https://* ]]; then
            echo "VITE_SUPABASE_URL must be a non-empty HTTPS URL." >&2
            exit 1
          fi
          if [[ -z "$SUPABASE_ANON_KEY" ]]; then
            echo "VITE_SUPABASE_ANON_KEY must not be empty." >&2
            exit 1
          fi

          printf 'supabase_url=%s\n' "$SUPABASE_URL" >> "$GITHUB_OUTPUT"
          printf 'supabase_anon_key=%s\n' "$SUPABASE_ANON_KEY" >> "$GITHUB_OUTPUT"

  build:
    needs: [build-config]
    permissions:
      contents: read
      packages: write
    uses: FreakMediaLP/Workflows/.github/workflows/build-docker.yml@v3
    with:
      version: staging
      cleanup: true
      keep-versions: 3
      build-args: |
        VITE_SUPABASE_URL=${{ needs.build-config.outputs.supabase_url }}
        VITE_SUPABASE_ANON_KEY=${{ needs.build-config.outputs.supabase_anon_key }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Reset staging database and load seed
        uses: ./.github/actions/reset-staging-database
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          remote-db-port: ${{ vars.SUPABASE_DB_REMOTE_PORT }}
          database-url: ${{ secrets.SUPABASE_MIGRATION_DB_URL }}
          github-token: ${{ github.token }}

      - name: Deploy staging frontend
        uses: ./.github/actions/deploy-docker-compose
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          remote-path: ${{ vars.DEPLOY_PATH }}
          compose-project: staging
          image-tag: staging
          app-port: ${{ vars.APP_PORT }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          cleanup: "true"

      - name: Debug deploy directory
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REMOTE_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$REMOTE_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || [[ "$REMOTE_PATH" =~ (^|/)\.\.(/|$) ]]; then
            echo "DEPLOY_PATH must be a safe absolute server path." >&2
            exit 1
          fi

          key_file="$RUNNER_TEMP/debug-deploy-key"
          known_hosts_file="$RUNNER_TEMP/debug-deploy-known-hosts"

          cleanup() {
            rm -f "$key_file" "$known_hosts_file"
          }
          trap cleanup EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"

          printf -v quoted_remote_path '%q' "$REMOTE_PATH"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known_hosts_file" \
            -i "$key_file" \
            "$SSH_USERNAME@$SSH_HOST" \
            "set -e
             cd $quoted_remote_path
             echo '===== Directory tree ($quoted_remote_path) ====='
             if command -v tree >/dev/null 2>&1; then tree -a; else find . -maxdepth 2 -print | sort; fi
             echo
             echo '===== docker-compose.yml ====='
             cat docker-compose.yml
             echo
             echo '===== .env ====='
             cat .env"
