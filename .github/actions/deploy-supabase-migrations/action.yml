name: Deploy Supabase migrations
description: Verify and deploy Supabase migrations through a protected SSH tunnel

inputs:
  environment:
    description: Expected database environment marker
    required: true
  ssh-host:
    description: SSH server hostname
    required: true
  ssh-username:
    description: SSH server username
    required: true
  ssh-private-key:
    description: SSH private key
    required: true
  ssh-known-hosts:
    description: Verified known_hosts entry for the SSH server
    required: true
  remote-db-port:
    description: Server-local Postgres or Supavisor session port
    required: true
  database-url:
    description: Encoded database URL using runner-local port 55432
    required: true
  github-token:
    description: GitHub token used by the Supabase CLI setup action
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install migration verifier dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v2
      with:
        version: 2.109.1
        github-token: ${{ inputs.github-token }}

    - name: Verify and deploy migrations
      shell: bash
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USERNAME: ${{ inputs.ssh-username }}
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        REMOTE_DB_PORT: ${{ inputs.remote-db-port }}
        SUPABASE_MIGRATION_DB_URL: ${{ inputs.database-url }}
      run: |
        set -Eeuo pipefail

        if [[ ! "$REMOTE_DB_PORT" =~ ^[0-9]+$ ]] || (( REMOTE_DB_PORT < 1 || REMOTE_DB_PORT > 65535 )); then
          echo "SUPABASE_DB_REMOTE_PORT must be a valid TCP port." >&2
          exit 1
        fi

        echo "::add-mask::$SUPABASE_MIGRATION_DB_URL"

        key_file="$RUNNER_TEMP/supabase-migration-key"
        known_hosts_file="$RUNNER_TEMP/supabase-migration-known-hosts"
        tunnel_pid=""

        cleanup() {
          if [[ -n "$tunnel_pid" ]] && kill -0 "$tunnel_pid" 2>/dev/null; then
            kill "$tunnel_pid" 2>/dev/null || true
            wait "$tunnel_pid" 2>/dev/null || true
          fi
          rm -f "$key_file" "$known_hosts_file"
        }
        trap cleanup EXIT

        printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
        chmod 600 "$key_file" "$known_hosts_file"

        ssh \
          -N \
          -o BatchMode=yes \
          -o ExitOnForwardFailure=yes \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=3 \
          -o StrictHostKeyChecking=yes \
          -o "UserKnownHostsFile=$known_hosts_file" \
          -i "$key_file" \
          -L "127.0.0.1:55432:127.0.0.1:$REMOTE_DB_PORT" \
          "$SSH_USERNAME@$SSH_HOST" &
        tunnel_pid=$!

        sleep 2
        if ! kill -0 "$tunnel_pid" 2>/dev/null; then
          wait "$tunnel_pid"
        fi

        node scripts/verify-supabase-migrations.mjs \
          --environment "$DEPLOY_ENVIRONMENT" \
          --phase before

        supabase db push \
          --db-url "$SUPABASE_MIGRATION_DB_URL" \
          --dry-run \
          --debug

        supabase db push \
          --db-url "$SUPABASE_MIGRATION_DB_URL" \
          --debug

        node scripts/verify-supabase-migrations.mjs \
          --environment "$DEPLOY_ENVIRONMENT" \
          --phase after
