name: Reset staging Supabase database
description: Clear staging Auth, reset the database, and load the deterministic seed through a protected SSH tunnel

inputs:
  ssh-host:
    description: SSH server hostname
    required: true
  ssh-username:
    description: SSH server username
    required: true
  ssh-private-key:
    description: SSH private key
    required: true
  ssh-known-hosts:
    description: Verified known_hosts entry for the SSH server
    required: true
  remote-db-port:
    description: Server-local Postgres or Supavisor session port
    required: true
  database-url:
    description: Encoded staging database URL using runner-local port 55432
    required: true
  github-token:
    description: GitHub token used by the Supabase CLI setup action
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install database tooling
      shell: bash
      run: npm ci --ignore-scripts

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v2
      with:
        version: 2.109.1
        github-token: ${{ inputs.github-token }}

    - name: Reset staging from seed
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
        SSH_USERNAME: ${{ inputs.ssh-username }}
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        REMOTE_DB_PORT: ${{ inputs.remote-db-port }}
        SUPABASE_MIGRATION_DB_URL: ${{ inputs.database-url }}
      run: |
        set -Eeuo pipefail

        if [[ ! "$REMOTE_DB_PORT" =~ ^[0-9]+$ ]] || (( REMOTE_DB_PORT < 1 || REMOTE_DB_PORT > 65535 )); then
          echo "SUPABASE_DB_REMOTE_PORT must be a valid TCP port." >&2
          exit 1
        fi

        echo "::add-mask::$SUPABASE_MIGRATION_DB_URL"

        key_file="$RUNNER_TEMP/supabase-reset-key"
        known_hosts_file="$RUNNER_TEMP/supabase-reset-known-hosts"
        tunnel_pid=""

        cleanup() {
          if [[ -n "$tunnel_pid" ]] && kill -0 "$tunnel_pid" 2>/dev/null; then
            kill "$tunnel_pid" 2>/dev/null || true
            wait "$tunnel_pid" 2>/dev/null || true
          fi
          rm -f "$key_file" "$known_hosts_file"
        }
        trap cleanup EXIT

        printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts_file"
        chmod 600 "$key_file" "$known_hosts_file"

        ssh \
          -N \
          -o BatchMode=yes \
          -o ConnectTimeout=15 \
          -o ExitOnForwardFailure=yes \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=3 \
          -o StrictHostKeyChecking=yes \
          -o "UserKnownHostsFile=$known_hosts_file" \
          -i "$key_file" \
          -L "127.0.0.1:55432:127.0.0.1:$REMOTE_DB_PORT" \
          "$SSH_USERNAME@$SSH_HOST" &
        tunnel_pid=$!

        tunnel_ready="false"
        for attempt in {1..30}; do
          if ! kill -0 "$tunnel_pid" 2>/dev/null; then
            echo "The SSH tunnel exited before local port 55432 became ready." >&2
            wait "$tunnel_pid" || true
            exit 1
          fi

          if timeout 1 bash -c "echo > /dev/tcp/127.0.0.1/55432" 2>/dev/null; then
            tunnel_ready="true"
            break
          fi

          sleep 1
        done

        if [[ "$tunnel_ready" != "true" ]]; then
          echo "The SSH tunnel did not begin listening on 127.0.0.1:55432 within 30 seconds." >&2
          exit 1
        fi

        node scripts/prepare-staging-seed-reset.mjs

        supabase db reset \
          --db-url "$SUPABASE_MIGRATION_DB_URL" \
          --yes \
          --debug

        node scripts/verify-supabase-migrations.mjs \
          --environment staging \
          --phase after

        node scripts/verify-staging-seed.mjs
